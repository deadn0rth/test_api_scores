[pytest]
markers =
    rate_limit: tests that intentionally trigger API throttling behavior

# --- logging (use -s or --log-cli-level=INFO to see live) ---
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_level = DEBUG
log_format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# --- html report (requires pytest-html) ---
# run:  pytest --html=report.html --self-contained-html
